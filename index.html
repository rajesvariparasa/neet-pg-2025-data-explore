<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore NEET PG counselling allotments across rounds and final assignments.">
  <title>NEET PG 2025 Counselling Data Explorer</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">NEET PG 2025 Counselling Data Explorer</span>

      <button id="shareLink" class="btn btn-outline-light btn-sm" type="button">
        Share filtered view
      </button>
    </div>
  </nav>

  <div id="filter-container" aria-label="Data filters"></div>

  <main class="container-fluid my-3">
    <div class="toolbar d-flex justify-content-between align-items-center gap-3 mb-3">
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <label class="final-toggle">
          <input type="checkbox" id="toggleFinalAssignment">
          <span>Final assignment only</span>
        </label>

        <span id="finalStatusText" class="text-muted small">
          (Showing all rounds)
        </span>

        <span id="result-count" class="result-count">
          Loading...
        </span>
      </div>

      <button id="resetFilters" class="btn btn-sm btn-secondary" type="button">
        Reset all filters
      </button>
    </div>

    <div class="table-responsive">
      <table id="neetTable" class="table table-striped table-hover table-bordered w-100">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <div id="share-toast" class="share-toast" role="status" aria-live="polite"></div>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
  <script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
